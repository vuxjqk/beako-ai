name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      # Same image as docker-compose: the tests need real PostgreSQL with pgvector
      db:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_USER: beako
          POSTGRES_PASSWORD: beako
          POSTGRES_DB: beako_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U beako -d beako_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Must end in _test: the tests empty its tables (see tests/conftest.py)
      DATABASE_URL: postgresql+psycopg://beako:beako@localhost:5432/beako_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  frontend:
    name: Frontend lint and types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
