services:
  db:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build: .
    # Watch only backend code; polling the whole repo (frontend/node_modules) burns CPU
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir src
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/auth}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
      AVATAR_MAX_BYTES: ${AVATAR_MAX_BYTES:-2097152}
      OTP_EXPIRE_MINUTES: ${OTP_EXPIRE_MINUTES:-10}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-10}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.8-flash}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-700}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      JUDGE_PROVIDER: ${JUDGE_PROVIDER:-}
      JUDGE_MODEL: ${JUDGE_MODEL:-}
      JUDGE_API_KEY: ${JUDGE_API_KEY:-}
      JUDGE_BASE_URL: ${JUDGE_BASE_URL:-}
      JUDGE_REASONING_EFFORT: ${JUDGE_REASONING_EFFORT:-}
      LLM_MAX_RETRY_WAIT_SECONDS: ${LLM_MAX_RETRY_WAIT_SECONDS:-20}
      QA_TOP_K: ${QA_TOP_K:-6}
      # Empty = the default in src/core/config.py
      RETRIEVAL_METHOD: ${RETRIEVAL_METHOD:-}
      RETRIEVAL_SCOPE: ${RETRIEVAL_SCOPE:-}
      RETRIEVAL_RERANK: ${RETRIEVAL_RERANK:-}
      QA_MODE: ${QA_MODE:-}
      QA_ESCALATE: ${QA_ESCALATE:-}
      # Guardrails and cost tracking (see src/core/config.py)
      QA_USER_PER_MINUTE: ${QA_USER_PER_MINUTE:-5}
      QA_USER_PER_DAY: ${QA_USER_PER_DAY:-100}
      QA_USER_DAILY_TOKENS: ${QA_USER_DAILY_TOKENS:-300000}
      QA_USER_MAX_CONCURRENT: ${QA_USER_MAX_CONCURRENT:-1}
      QA_DAILY_BUDGET_USD: ${QA_DAILY_BUDGET_USD:-5}
      QA_DEGRADE_AT: ${QA_DEGRADE_AT:-0.8}
      QA_TIMEZONE: ${QA_TIMEZONE:-UTC}
      LLM_PRICE_INPUT_PER_MTOK: ${LLM_PRICE_INPUT_PER_MTOK:-0.5}
      LLM_PRICE_OUTPUT_PER_MTOK: ${LLM_PRICE_OUTPUT_PER_MTOK:-3}
      LLM_MAX_TOTAL_RETRY_SECONDS: ${LLM_MAX_TOTAL_RETRY_SECONDS:-45}
      # Bind mounts from Windows/macOS hosts don't propagate inotify events
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Local SMTP server that catches all outgoing mail; inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  postgres_data:
